name: Daily Momentum Scans
on:
  workflow_dispatch:
  schedule:
    - cron: '7 22 * * 1-5'   # ~6 PM Eastern during EDT (Mar-Nov)
    - cron: '7 23 * * 1-5'   # ~6 PM Eastern during EST (Nov-Mar)
jobs:
  run-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if today's scan already succeeded
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY_UTC=$(date -u +%Y-%m-%d)
          ALREADY_RAN=$(gh run list --workflow=daily-scans.yml --status=success --limit 10 --json createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"$TODAY_UTC\"))] | length")
          if [ "$ALREADY_RAN" -gt 0 ]; then
            echo "A scan already succeeded today ($ALREADY_RAN run(s)) -- skipping this trigger."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: github.event_name != 'schedule' || steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: github.event_name != 'schedule' || steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.proceed == 'true'
        run: npm install
      - name: Run Scanners
        if: github.event_name != 'schedule' || steps.gate.outputs.proceed == 'true'
        run: node index.js
