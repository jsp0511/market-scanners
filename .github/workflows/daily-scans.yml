name: Daily Momentum Scans
on:
  workflow_dispatch:
  schedule:
    # 6:00 PM Eastern, covering both DST states:
    - cron: '0 22 * * 1-5'   # 6 PM EDT (Mar-Nov) = 22:00 UTC
    - cron: '0 23 * * 1-5'   # 6 PM EST (Nov-Mar) = 23:00 UTC
jobs:
  run-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Only proceed if it's actually 6 PM Eastern
        id: gate
        run: |
          HOUR=$(TZ="America/New_York" date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "18" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: npm install
      - name: Run Scanners
        if: steps.gate.outputs.proceed == 'true'
        run: node index.js
